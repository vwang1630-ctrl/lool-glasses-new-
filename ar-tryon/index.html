<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>实时试戴 v8 · 三点锚定</title>
<meta name="robots" content="noindex, nofollow">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font:14px/1.5 system-ui,sans-serif}
#threejsContainer{position:fixed;inset:0}
#threejsContainer canvas{width:100%!important;height:100%!important;display:block}
#tryon-video{position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:.01;pointer-events:none}
#status{position:fixed;top:0;left:0;right:0;z-index:10;padding:12px;text-align:center;
  background:linear-gradient(rgba(0,0,0,.65),transparent);color:#fff;font-size:14.5px;line-height:1.5}
#status .err{color:#e07b6a;font-weight:700}
#track{position:fixed;bottom:84px;left:0;right:0;z-index:10;text-align:center;font-size:15px;font-weight:700}
#hud{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
  padding:14px 16px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.55))}
button{background:#26262c;color:#eee;border:1px solid #3a3a42;border-radius:8px;padding:11px 18px;font-size:14px;cursor:pointer}
#start{background:#3fae8c;border-color:#3fae8c;color:#08130f;font-weight:700;font-size:15px}
#sizeWrap,#calval{align-self:center;color:#3fae8c;font-size:13px}
input[type=range]{vertical-align:middle;width:110px}
</style>
<script type="importmap">
{ "imports": { "three": "/admin/tryon-assets/three.module.js?v=8" } }
</script>
</head>
<body>
<div id="threejsContainer"></div>
<video id="tryon-video" autoplay playsinline muted></video>
<div id="status">v8 · 点「▶ 开始试戴」— 授权后立刻看到自己，眼镜跟住耳朵和鼻梁</div>
<div id="track"></div>
<div id="hud">
  <button id="start">▶ 开始试戴</button>
  <button id="snap" hidden>📸 截图</button>
  <span id="sizeWrap" hidden>大小
    <input type="range" id="sizeR" min="0.5" max="2" step="0.05">
    <span id="sizeVal"></span>
  </span>
  <span id="calval" hidden></span>
</div>

<script type="module">
/* v8 终版 = MIT 引擎(alperenuzun/basic-virtual-tryon-glasses)渲染
   + 站主三点锚定:镜腿跟耳朵、鼻托跟鼻梁中心——纯几何,无姿态矩阵,无符号地狱
   + 视频精灵镜像显示、颜色管线修正、尺寸自适应 */
window.__MODULE_RAN = true;

const $ = (id) => document.getElementById(id);
const statusEl = $("status"), trackEl = $("track");
const video = $("tryon-video");
const L = (m) => { const d = document.createElement("div"); d.textContent = m; statusEl.appendChild(d); };
const S = (m) => { const d = document.createElement("div"); d.className = "ok"; d.textContent = m; statusEl.appendChild(d); };
const E = (m) => { const d = document.createElement("div"); d.className = "err"; d.textContent = m; statusEl.appendChild(d); };
const setTrack = (m, c) => { trackEl.textContent = m; trackEl.style.color = c || "#3fae8c"; };
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

const ASSETS = "/admin/tryon-assets";
const CFG = { refWidth: 130, up: 0.02, glassesScale: 1.22 };
const FACE_OVAL = [10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109];

let THREE_, renderer, scene, cam3;
let videoTex = null, bgSprite = null;
let glassesObj = null, occluder = null;
let faceLandmarker = null;
let lastVW = 0, lastVH = 0, lastVideoTime = -1, busy = false, faceLocked = false;

/* ═══ 场景初始化(MIT 架构:视频精灵在 GL 内,正交相机负象限) ═══ */
async function initScene() {
  THREE_ = await import("three");
  scene = new THREE_.Scene();

  renderer = new THREE_.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.toneMapping = THREE_.NoToneMapping;
  renderer.outputColorSpace = THREE_.SRGBColorSpace;
  renderer.setClearColor(0x000000, 0);
  $("threejsContainer").appendChild(renderer.domElement);
  renderer.domElement.style.width = "100%";
  renderer.domElement.style.height = "100%";
  renderer.domElement.style.display = "block";
  renderer.domElement.style.objectFit = "cover";

  videoTex = new THREE_.VideoTexture(video);
  videoTex.minFilter = THREE_.LinearFilter;
  videoTex.colorSpace = THREE_.SRGBColorSpace;

  cam3 = new THREE_.OrthographicCamera(-1, 1, 1, -1, 0.1, 5000);
  resizeGL();
  addEventListener("resize", resizeGL);

  bgSprite = new THREE_.Sprite(new THREE_.SpriteMaterial({ map: videoTex, depthWrite: false }));
  scene.add(bgSprite);

  scene.add(new THREE_.AmbientLight(0xffffff, 0.9));
  const key = new THREE_.DirectionalLight(0xffffff, 1.2); key.position.set(0, 100, 300); scene.add(key);
  const fill = new THREE_.DirectionalLight(0xeef0ff, 0.4); fill.position.set(-80, 30, 120); scene.add(fill);

  glassesObj = buildGlasses();
  scene.add(glassesObj);

  occluder = buildOccluder();
  scene.add(occluder);
  window.__DBG = { scene, glassesObj, occluder, THREE_, cam3, video, renderer };
}

function resizeGL() {
  const vw = video.videoWidth || 1280, vh = video.videoHeight || 720;
  renderer.setSize(vw, vh, false);
  cam3.left = -vw / 2; cam3.right = vw / 2; cam3.top = vh / 2; cam3.bottom = -vh / 2;
  cam3.updateProjectionMatrix();
  if (bgSprite) bgSprite.scale.set(-vw, vh, 1);  // 负宽度=镜像(自拍视角),MIT 原版方案
}

/* ═══ 眼镜(MIT 原版建模:金丝圆框+G-15 镜片) ═══ */
function buildGlasses() {
  const T = THREE_;
  const g = new T.Group();
  const lensW = 52, lensH = 43, bridgeGap = 17, wireR = 0.7, templeLen = 145;
  const cx = bridgeGap / 2 + lensW / 2 + 1.5;
  const acetate = new T.MeshPhysicalMaterial({ color: 0x3d1f0d, roughness: 0.16, clearcoat: 0.95, side: T.DoubleSide });
  const gold = new T.MeshStandardMaterial({ color: 0xc9a54e, metalness: 0.92, roughness: 0.12, side: T.DoubleSide });
  const goldD = new T.MeshStandardMaterial({ color: 0xa08030, metalness: 0.88, roughness: 0.18 });
  const lens = new T.MeshPhysicalMaterial({ color: 0x1c2e1c, roughness: 0.02, transparent: true, opacity: 0.68, side: T.DoubleSide, depthWrite: false, clearcoat: 1 });
  const ell = (w, h) => {
    const pts = [];
    for (let i = 0; i <= 72; i++) { const a = (i / 72) * Math.PI * 2; pts.push(new T.Vector3(Math.cos(a) * w * .5, Math.sin(a) * h * .5, 0)); }
    return new T.CatmullRomCurve3(pts, true);
  };
  const rim = (x) => { const m = new T.Mesh(new T.TubeGeometry(ell(lensW, lensH), 72, wireR, 8, true), gold); m.position.x = x; return m; };
  g.add(rim(-cx)); g.add(rim(cx));
  const lensM = (x) => { const sh = new T.Shape(); sh.absellipse(0, 0, lensW * .485, lensH * .485, 0, Math.PI * 2, false, 0);
    const m = new T.Mesh(new T.ShapeGeometry(sh, 48), lens); m.position.set(x, 0, 0.2); return m; };
  g.add(lensM(-cx)); g.add(lensM(cx));
  const bp = [new T.Vector3(-cx + lensW * .35, lensH * .08, wireR), new T.Vector3(-bridgeGap * .25, lensH * .18, wireR * 2),
    new T.Vector3(0, lensH * .22, wireR * 2.5), new T.Vector3(bridgeGap * .25, lensH * .18, wireR * 2),
    new T.Vector3(cx - lensW * .35, lensH * .08, wireR)];
  g.add(new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(bp), 24, wireR * 1.2, 8, false), gold));
  const temple = (side) => { const p = new T.Group();
    p.position.set(side * (cx + lensW * .5 + 2.5), lensH * .2, 0);
    const ap = new T.CatmullRomCurve3([new T.Vector3(0,0,0), new T.Vector3(0,0,-templeLen*.5), new T.Vector3(0,0,-templeLen)]);
    p.add(new T.Mesh(new T.TubeGeometry(ap, 32, 1, 8, false), gold));
    const tp = new T.CatmullRomCurve3([new T.Vector3(0,0,-templeLen*.65), new T.Vector3(0,0,-templeLen*.82), new T.Vector3(0,0,-templeLen)]);
    p.add(new T.Mesh(new T.TubeGeometry(tp, 16, 1.6, 8, false), acetate));
    p.rotation.y = side * 0.06; return p; };
  g.add(temple(-1)); g.add(temple(1));
  return g;
}

/* ═══ 遮挡网(MIT 原版:36 点脸轮廓扇形,只写深度) ═══ */
function buildOccluder() {
  const T = THREE_;
  const n = FACE_OVAL.length;
  const pos = new Float32Array((n + 1) * 3);
  const idx = [];
  for (let i = 0; i < n; i++) idx.push(0, i + 1, ((i + 1) % n) + 1);
  const geo = new T.BufferGeometry();
  geo.setAttribute("position", new T.BufferAttribute(pos, 3));
  geo.setIndex(idx);
  const mesh = new T.Mesh(geo, new T.MeshBasicMaterial({ colorWrite: false, side: T.DoubleSide }));
  mesh.renderOrder = 1; mesh.frustumCulled = false;
  return mesh;
}

/* ═══ 追踪+放置:三点锚定 ═══ */
const sm = { pos: null, roll: null, yaw: null, s: null };

function updatePlacement(lms) {
  const vw = video.videoWidth, vh = video.videoHeight;
  const P = (i) => new THREE_.Vector3((lms[i].x - 0.5) * vw, (0.5 - lms[i].y) * vh, (lms[i].z || 0) * vw);
  const earL = P(234), earR = P(454), bridge = P(168);
  const width = earL.distanceTo(earR);
  if (width < 1) return;

  const userSize = Number(localStorage.getItem("tj_size") || 1);
  const up = Number(localStorage.getItem("tj_up") || 0.02);

  const tP = bridge.clone(); tP.y += up;
  const s = (width / 130) * CFG.glassesScale * userSize;
  const roll = Math.atan2(earR.y - earL.y, earR.x - earL.x);
  const dL = bridge.distanceTo(earL), dR = bridge.distanceTo(earR);
  const yaw = Math.asin(clamp((dL - dR) / width, -1, 1)) * 0.9;

  sm.pos = sm.pos ? sm.pos.lerp(tP, 0.5) : tP.clone();
  sm.roll = sm.roll !== null ? sm.roll + (roll - sm.roll) * 0.4 : roll;
  sm.yaw = sm.yaw !== null ? sm.yaw + (yaw - sm.yaw) * 0.4 : yaw;
  sm.s = sm.s ? sm.s + (s - sm.s) * 0.3 : s;

  glassesObj.position.copy(sm.pos);
  glassesObj.rotation.set(0, -sm.yaw, -sm.roll);
  glassesObj.scale.setScalar(sm.s);
}

/* ═══ 逐帧 ═══ */
function loop() {
  requestAnimationFrame(loop);
  if (!faceLandmarker || busy || video.readyState < 2) return;
  if (video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  busy = true;
  try {
    const res = faceLandmarker.detectForVideo(video, performance.now());
    let lms = res.faceLandmarks && res.faceLandmarks[0];
    const FORCE = location.search.includes("force=1");
    if (FORCE) {  // force 模式:无条件用合成锚点(假摄像头的垃圾检测会干扰)
      lms = new Array(468).fill(0).map(() => ({ x: 0.5, y: 0.45, z: 0 }));
      const put = (i, x, y, z) => lms[i] = { x, y, z: z || 0 };
      put(234, .34, .47, .1); put(454, .66, .47, .1); put(168, .50, .50);
      put(33, .40, .45); put(133, .45, .46); put(362, .55, .46); put(263, .60, .45);
      put(10, .50, .34); put(175, .50, .68);
      FACE_OVAL.forEach((idx, k) => { const a = (k / 36) * Math.PI * 2; put(idx, .5 + Math.cos(a) * .17, .47 + Math.sin(a) * .17, .05); });
    }
    const Q = new URLSearchParams(location.search);
    const NOOCC = Q.has("noocc");
    const ZOFF = Number(Q.get("zoff") || 0);
    if (lms) {
      if (!faceLocked) { faceLocked = true; setTrack("✓ 人脸已锁定 — 眼镜上脸", "#3fae8c"); }
      updatePlacement(lms);
      glassesObj.position.z += ZOFF;
      glassesObj.visible = true;
      occluder.visible = !NOOCC;
    } else {
      if (faceLocked) { faceLocked = false; setTrack("… 未检测到人脸 — 正对摄像头,40-70cm", "#d9a441"); }
      glassesObj.visible = false;
      occluder.visible = false;
    }
  } catch (e) { console.error(e); }
  busy = false;
  renderer.render(scene, cam3);
}

/* ═══ 启动:先摄像头(立刻见脸),引擎后台加载 ═══ */
$("start").onclick = async () => {
  $("start").disabled = true;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 1280, height: 720 } });
    video.srcObject = stream; await video.play();
    S("摄像头 ✓ — 屏幕里就是你");
    initScene();
    L("加载追踪引擎(后台)…");
    const vision = await import(ASSETS + "/vision_bundle.mjs?v=8");
    const fileset = await vision.FilesetResolver.forVisionTasks(ASSETS + "/wasm");
    faceLandmarker = await vision.FaceLandmarker.createFromOptions(fileset, {
      baseOptions: { modelAssetPath: ASSETS + "/face_landmarker.task?v=8", delegate: "GPU" },
      runningMode: "VIDEO", numFaces: 1,
      outputFaceBlendshapes: false, outputFacialTransformationMatrixes: false,
    });
    S("引擎 ✓ — 正对摄像头,眼镜自动上脸");
    setTrack("", "#3fae8c");
    loop();
  } catch (e) {
    const n = e.name || "";
    E("失败[" + n + "]: " + e.message + " — " +
      (n === "NotAllowedError" ? "授权被拒:地址栏左侧摄像头图标→允许→刷新" :
       n === "NotFoundError" ? "设备无摄像头" :
       n === "NotReadableError" ? "摄像头被占用" : "看 console"));
    $("start").disabled = false;
  }
};

$("snap").onclick = () => {
  const c = document.createElement("canvas");
  c.width = renderer.domElement.width; c.height = renderer.domElement.height;
  const ctx = c.getContext("2d");
  ctx.drawImage(renderer.domElement, 0, 0);
  const a = document.createElement("a"); a.download = "tryon-" + Date.now() + ".png";
  a.href = c.toDataURL("image/png"); a.click();
};
</script>
</body>
</html>
